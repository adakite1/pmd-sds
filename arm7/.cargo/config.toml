[build]
target = "../target-specs/armv4t-none-eabi.json"

[unstable]
json-target-spec = true
build-std = ["core", "compiler_builtins"]
build-std-features = [
    "compiler-builtins-mem",
    "optimize_for_size"
]

[target.armv4t-none-eabi]
rustflags = [
    "-Clink-arg=-Tarm7.ld",
    "-Clink-arg=--nmagic",
    "-Ctarget-cpu=arm7tdmi",
    "-Crelocation-model=static", # PIC (Position-Independent Code) requires additional sections like .got (global offset table) to work. No need for that, we just want fixed addresses
]
