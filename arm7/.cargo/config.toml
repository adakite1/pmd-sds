[build]
target = "thumbv4t-none-eabi"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = [
    "compiler-builtins-mem",
    "panic_immediate_abort", # this should delete "core::fmt" stuff; aborting will then hit an ARM7 undefined-instruction.
    "optimize_for_size"
]

[target.thumbv4t-none-eabi]
rustflags = [
    "-Clink-arg=-Tarm7.ld",
    "-Clink-arg=--nmagic",
    "-Ctarget-cpu=arm7tdmi",
    "-C relocation-model=static", # PIC (Position-Independent Code) requires additional sections like .got (global offset table) to work. No need for that, we just want fixed addresses
]
