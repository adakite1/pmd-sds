[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
object = "0.40"
ds-rom = "0.8"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rustc-demangle = "0.1"
syn = { version = "3", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
anstream = "1"
